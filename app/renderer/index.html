<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Automation Agent</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-drag-region">
        <button id="new-chat-btn" class="new-chat-btn" title="New Chat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          New Chat
        </button>
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
      <div class="sidebar-footer">
        <button id="knowledge-btn" class="memory-btn" title="View Knowledge Index">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 6L12 2L4 6V18L12 22L20 18V6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 22V10" stroke="currentColor" stroke-width="2"/>
            <path d="M20 6L12 10L4 6" stroke="currentColor" stroke-width="2"/>
          </svg>
          Knowledge
        </button>
        <button id="memory-btn" class="memory-btn" title="View Memory">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Memory
        </button>
      </div>
    </aside>
    <div class="main-area">
      <div id="indexing-indicator" class="indexing-indicator" style="display:none">
        <div class="indexing-spinner"></div>
        <span id="indexing-indicator-text">Indexing...</span>
        <span id="indexing-indicator-count" class="indexing-count"></span>
      </div>
      <div id="knowledge-panel" class="knowledge-panel" style="display:none">
        <div class="memory-panel-header">
          <div class="memory-panel-title">Knowledge Index</div>
          <div class="memory-panel-header-right">
            <button id="knowledge-clear-btn" class="memory-clear-btn">Clear All</button>
            <button id="knowledge-root-btn" class="memory-clear-btn">Choose Folder</button>
            <button id="knowledge-close-btn" class="memory-close-btn">&#x2715;</button>
          </div>
        </div>
        <div class="knowledge-root-label" id="knowledge-root-label"></div>
        <div class="knowledge-stats" id="knowledge-stats"></div>
        <div class="knowledge-search-row">
          <input type="text" id="knowledge-search-input" class="knowledge-search-input" placeholder="Search your files..." autocomplete="off" />
          <select id="knowledge-search-mode" class="knowledge-search-mode">
            <option value="hybrid">Hybrid</option>
            <option value="semantic">Semantic</option>
            <option value="metadata">Metadata</option>
          </select>
        </div>
        <div id="knowledge-results" class="knowledge-results"></div>
      </div>
      <div id="memory-panel" class="memory-panel" style="display:none">
        <div class="memory-panel-header">
          <div class="memory-panel-title">Memory</div>
          <div class="memory-panel-header-right">
            <button id="memory-clear-all-btn" class="memory-clear-btn">Clear All</button>
            <button id="memory-close-btn" class="memory-close-btn">✕</button>
          </div>
        </div>
        <div class="memory-panel-desc">Facts the agent remembers from your conversations</div>
        <div id="memory-list" class="memory-list"></div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="queue-container" id="queue-container"></div>
      <div class="input-row">
        <select id="model-select"></select>
        <label class="agent-toggle">
          <input type="checkbox" id="use-agent" />
          <span>Agent</span>
        </label>
        <input type="text" id="chat-input" placeholder="Describe what you want done..." autofocus autocomplete="off" />
        <button id="send-btn" type="button">
          <span id="send-icon-send" class="send-icon send-icon-send"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 19V7M7 12L12 7L17 12"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg></span>
          <span id="send-icon-cancel" class="send-icon send-icon-cancel">
              <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <rect
                    x="5.5"
                    y="5.5"
                    width="13"
                    height="13"
                    rx="4"
                    fill="currentColor"
                  />
                </svg>
          </span>
        </button>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
